[project]
name = "snowflake-nl-sql-comparator"
version = "0.1.0"
description = "Compare Claude-generated Snowflake SQL against Snowflake Cortex Agent output, side-by-side"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "snowflake-connector-python>=3.12.0",
    "streamlit>=1.40.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "ruamel-yaml>=0.18",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
    "plotly>=5.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
